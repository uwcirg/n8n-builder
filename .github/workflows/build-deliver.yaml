# docker continuous delivery
# deliver docker images to configured repo with tags to match branches and git tags
---
name: Build & Deliver
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git commit
        uses: actions/checkout@master
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply n8n patch
        if: env.N8N_PATCH != ''
        env:
          N8N_PATCH: ${{ secrets.N8N_PATCH }}
        run: |
          cd n8n
          printf '%s' "$N8N_PATCH" | git apply

      - run: cd n8n && git apply ../patches/workaround.patch

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install -g pnpm
      - run: pnpm install
        working-directory: n8n

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build docker images
        working-directory: n8n
        run: pnpm build:docker

      - name: Tag n8n Docker image
        run: |
          # Use branch name if on branch, else use tag
          IMAGE_TAG="${GITHUB_REF_NAME}"
          # Replace slashes in branch names (e.g., feature/xyz -> feature-xyz)
          IMAGE_TAG="${IMAGE_TAG//\//-}"
          docker tag n8nio/n8n:local ghcr.io/${{ github.repository }}:${IMAGE_TAG}

      - name: Log into GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Task Runner Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          file: Dockerfile.runner
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push Docker image to GHCR
        run: |
          IMAGE_TAG="${GITHUB_REF_NAME}"
          IMAGE_TAG="${IMAGE_TAG//\//-}"
          docker push ghcr.io/${{ github.repository }}:${IMAGE_TAG}
